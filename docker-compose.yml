services:
  db:
    build:
      context: ./backend/server/db
      dockerfile: Dockerfile
    image: manju-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: manju_dev
    volumes:
      - manju_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-40}
    mem_limit: ${DB_MEM_LIMIT:-512m}
    memswap_limit: ${DB_MEMSWAP_LIMIT:-768m}
    shm_size: ${DB_SHM_SIZE:-128mb}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && PGPASSWORD=$${POSTGRES_PASSWORD} psql -h 127.0.0.1 -U postgres -d manju_dev -c 'SELECT 1' || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - manju_documents_data:/app/uploads/documents
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=manju_dev
      - AI_SERVICE_URL=http://ai_backend:8000
      - DOCUMENTS_STORAGE_PATH=/app/uploads/documents
      - GOMEMLIMIT=${BACKEND_GOMEMLIMIT:-192MiB}
      - FRONTEND_URL=${DOCKER_FRONTEND_URL:-https://manju.limitlesstech-co.com}
      - REDIRECT_URI=${DOCKER_REDIRECT_URI:-https://manju.limitlesstech-co.com/api/auth/callback/google}
    env_file:
      - ./backend/.env
    mem_limit: ${BACKEND_MEM_LIMIT:-384m}
    memswap_limit: ${BACKEND_MEMSWAP_LIMIT:-512m}
    depends_on:
      db:
        condition: service_healthy
      ai_backend:
        condition: service_started

  ai_backend:
    build:
      context: ./ai_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./ai_backend:/app
      - manju_documents_data:/app/uploads/documents
      - manju_faiss_indexes:/app/faiss_indexes
    env_file:
      - ./ai_backend/.env
    environment:
      - USE_LOCAL_TYPHOON_ASR=${USE_LOCAL_TYPHOON_ASR:-false}
      - TYPHOON_ASR_DEVICE=${TYPHOON_ASR_DEVICE:-cpu}
      - DOCUMENTS_STORAGE_PATH=/app/uploads/documents
      - FAISS_INDEX_PATH=/app/faiss_indexes
      - OMP_NUM_THREADS=${AI_OMP_NUM_THREADS:-1}
      - OPENBLAS_NUM_THREADS=${AI_OPENBLAS_NUM_THREADS:-1}
      - MKL_NUM_THREADS=${AI_MKL_NUM_THREADS:-1}
      - NUMEXPR_NUM_THREADS=${AI_NUMEXPR_NUM_THREADS:-1}
    mem_limit: ${AI_BACKEND_MEM_LIMIT:-1024m}
    memswap_limit: ${AI_BACKEND_MEMSWAP_LIMIT:-1536m}
    command: python main.py

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${DOCKER_VITE_API_URL:-https://manju.limitlesstech-co.com/api}
      VITE_MANJU_API_KEY: ${VITE_MANJU_API_KEY:-}
      NODE_OPTIONS: ${FRONTEND_NODE_OPTIONS:---max-old-space-size=256}
    mem_limit: ${FRONTEND_MEM_LIMIT:-512m}
    memswap_limit: ${FRONTEND_MEMSWAP_LIMIT:-768m}
    command: sh -c "if [ ! -x node_modules/.bin/vite ]; then echo 'Missing node_modules. Run npm install on the VM host once, then restart this service.'; exit 1; fi; npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  manju_postgres_data:
  manju_documents_data:
  manju_faiss_indexes:

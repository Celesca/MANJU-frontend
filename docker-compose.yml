version: '3.8'

services:
  db:
    build:
      context: ./backend/server/db
      dockerfile: Dockerfile
    image: manju-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manju_dev
    volumes:
      - manju_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=manju_dev
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai_backend:8000}
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      ai_backend:
        condition: service_started

  ai_backend:
    build:
      context: ./ai_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./ai_backend:/app
    command: python main.py

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_MANJU_API_KEY: ${VITE_MANJU_API_KEY:-}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  manju_postgres_data:
  frontend_node_modules:

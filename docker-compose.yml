version: '3.8'

services:
  db:
    build:
      context: ./backend/server/db
      dockerfile: Dockerfile
    image: manju-postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: manju_dev
    volumes:
      - manju_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -d manju_dev -c 'SELECT 1' || exit 1" ]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - manju_documents_data:/app/uploads/documents
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=manju_dev
      - AI_SERVICE_URL=http://ai_backend:8000
      - DOCUMENTS_STORAGE_PATH=/app/uploads/documents
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      ai_backend:
        condition: service_started

  ai_backend:
    build:
      context: ./ai_backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    working_dir: /app
    volumes:
      - ./ai_backend:/app
      - manju_documents_data:/app/uploads/documents
      - manju_faiss_indexes:/app/faiss_indexes
    env_file:
      - ./ai_backend/.env
    environment:
      - USE_LOCAL_TYPHOON_ASR=true
      - TYPHOON_ASR_DEVICE=cpu
      - DOCUMENTS_STORAGE_PATH=/app/uploads/documents
      - FAISS_INDEX_PATH=/app/faiss_indexes
    command: python main.py

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_MANJU_API_KEY: ${VITE_MANJU_API_KEY:-}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  manju_postgres_data:
  manju_documents_data:
  manju_faiss_indexes:
  frontend_node_modules:
